<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2A6B"/>
      <stop offset="0.55" stop-color="#4C3BCF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E1FF"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A6B" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FF7A6B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B0A2A" flood-opacity="0.35"/>
    </filter>
    <filter id="barShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1550" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body inside 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  </g>
  <!-- waveform -->
  <g fill="url(#bar)" filter="url(#barShadow)">
    <rect x="262" y="442" width="64" height="140" rx="32"/>
    <rect x="366" y="352" width="64" height="320" rx="32"/>
    <rect x="470" y="262" width="64" height="500" rx="32"/>
    <rect x="574" y="372" width="64" height="280" rx="32"/>
    <rect x="678" y="452" width="64" height="120" rx="32"/>
  </g>
  <!-- live dot -->
  <circle cx="742" cy="300" r="78" fill="url(#dotGlow)"/>
  <circle cx="742" cy="300" r="38" fill="#FF6B5B"/>
  <circle cx="730" cy="288" r="12" fill="#FFFFFF" fill-opacity="0.35"/>
</svg>
