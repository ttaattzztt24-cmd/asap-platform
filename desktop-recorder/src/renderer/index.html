<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; media-src 'self' file: blob:; style-src 'self'; script-src 'self'" />
  <title>Kiku</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="../assets/icon-256.png" alt="" width="36" height="36" />
      <div>
        <h1>Kiku</h1>
        <p class="tagline">会議の声を、そのまま残す</p>
      </div>
    </div>
    <span id="meetingBadge" class="badge">会議: 未検出</span>
  </header>

  <main>
    <section class="card status">
      <div class="status-row">
        <div>
          <div id="recState" class="rec-state">待機中</div>
          <div id="timer" class="timer">00:00:00</div>
        </div>
        <button id="recBtn" class="primary">録音を開始</button>
      </div>
      <div class="meter"><div id="meterBar" class="meter-bar"></div></div>
      <p id="micInUse" class="mic-in-use"></p>
      <p id="error" class="error" hidden></p>
      <p id="browserProblem" class="error" hidden></p>
    </section>

    <section class="card">
      <h2>設定</h2>
      <label class="toggle"><input type="checkbox" id="autoRecord" /> Zoom / Google Meet の会議が始まったら自動で録音する</label>
      <div class="field" id="recordModeField">
        <span>録音する会議</span>
        <label class="choice"><input type="radio" name="recordMode" value="all" /> すべての会議</label>
        <label class="choice"><input type="radio" name="recordMode" value="listed" /> 登録した会議だけ</label>
        <div id="meetingsBox" class="meetings-box" hidden>
          <ul id="meetings" class="meetings"></ul>
          <div class="add-row">
            <input id="meetingName" type="text" placeholder="名前（例: 週次定例）" />
            <input id="meetingLink" type="text" placeholder="Zoom / Google Meet のリンクを貼り付け" />
            <button id="addMeeting">追加</button>
          </div>
          <button id="addCurrentMeeting" class="link-button" hidden>今参加している会議を登録する</button>
          <p id="meetingError" class="error" hidden></p>
          <p class="hint">Google Meet はURLで会議を見分けます。Zoom は、リンクをクリックしたときにブラウザで開く「zoom.us/j/…」のページで見分けるので、登録した会議にはリンクから参加してください。登録していない会議が始まったときは通知が出て、クリックすると録音できます。</p>
        </div>
      </div>
      <label class="toggle"><input type="checkbox" id="includeMic" /> 自分の声（マイク）も録音する</label>
      <div class="field">
        <label for="micSelect">録音に使うマイク</label>
        <select id="micSelect"></select>
        <p class="hint">「自動」にすると、Zoom / Google Meet で選んでいるマイクをそのまま使います。会議中にマイクを切り替えても、録音も自動で切り替わります。</p>
      </div>
      <label class="toggle"><input type="checkbox" id="openAtLogin" /> PC起動時に自動で起動する</label>
      <div class="folder-row">
        <span>保存先:</span>
        <code id="saveDir"></code>
        <button id="chooseFolder">変更</button>
      </div>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>録音一覧</h2>
        <div>
          <button id="openLog">ログを開く</button>
          <button id="openFolder">フォルダを開く</button>
        </div>
      </div>
      <ul id="recordings" class="recordings"></ul>
    </section>
  </main>

  <script src="vendor/lame.min.js"></script>
  <script src="webm-demux.js"></script>
  <script src="mp3-export.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
