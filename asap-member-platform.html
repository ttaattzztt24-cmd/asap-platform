<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAP 会員プラットフォーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #fafaf8;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e5e5e0;
            --accent-color: #2c3e50;
            --accent-light: #ecf0f1;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* ヘッダー */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            font-family: 'Noto Serif JP', serif;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* メインコンテンツ */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 5rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-family: 'Noto Serif JP', serif;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* プログラムセクション */
        .programs-section {
            margin-bottom: 5rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-family: 'Noto Serif JP', serif;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            color: var(--accent-color);
        }

        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .program-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .program-card:hover {
            border-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.08);
        }

        .program-card h3 {
            font-size: 1.4rem;
            font-family: 'Noto Serif JP', serif;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .program-card p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }

        .program-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-light);
            color: var(--accent-color);
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.95rem;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .link-button:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .link-button.primary {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .link-button.primary:hover {
            background-color: #1a2634;
        }

        /* コンテンツセクション */
        .content-section {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .content-section h3 {
            font-size: 1.3rem;
            font-family: 'Noto Serif JP', serif;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }

        .content-section p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .content-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        /* フッター */
        footer {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5rem;
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 1.5rem;
            }

            nav ul {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .programs-grid {
                grid-template-columns: 1fr;
            }

            main {
                padding: 2rem 1rem;
            }
        }

        /* アニメーション */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .program-card {
            animation: fadeIn 0.6s ease-out;
        }

        .program-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .program-card:nth-child(3) {
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <div class="header-container">
            <div class="logo">ASAP</div>
            <nav>
                <ul>
                    <li><a href="#programs">プログラム</a></li>
                    <li><a href="#resources">リソース</a></li>

                </ul>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main>
        <!-- ヒーロー -->
        <section class="hero">
            <h1>会員プラットフォーム</h1>
            <p>ASAP の学習コンテンツと、コミュニティへのアクセスをまとめたプラットフォームです。</p>
        </section>

        <!-- プログラムセクション -->
        <section class="programs-section" id="programs">
            <h2 class="section-title">プログラム</h2>
            
            <div class="programs-grid">
                <!-- ASAP BOJE -->
                <div class="program-card">
                    <h3>ASAP BOJE</h3>
                    <div class="program-links">
                        <a href="http://phasap.com/" class="link-button primary">会員サイトへ</a>
                        <a href="https://x.gd/HPn8Q" class="link-button">受講生登録</a>
                    </div>
                </div>

                <!-- ASAP PH -->
                <div class="program-card">
                    <h3>ASAP PH</h3>
                    <div class="program-links">
                        <a href="https://asapbeshack.work/" class="link-button primary">会員サイトへ</a>
                        <a href="https://x.gd/K6wTZ8" class="link-button">受講生登録</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- リソースセクション -->
        <section class="programs-section" id="resources">
            <h2 class="section-title">リソース</h2>

            <div class="content-section">
                <h3>配信グループ</h3>
                <div class="content-links">
                    <a href="https://x.gd/XAefo" class="link-button">【ASAP】Deductive<br><span style="font-size: 0.85rem;">パスワード: 1100</span></a>
                </div>
            </div>

            <div class="content-section">
                <h3>講義グループ</h3>
                <p>合同セッションや講義の情報を共有するグループです。</p>
                <div class="content-links">
                    <a href="https://x.gd/Igwo1" class="link-button">ASAP合同セッション</a>
                </div>
            </div>
        </section>


    </main>

    <!-- フッター -->
    <footer>
        <p>&copy; 2026 ASAP. All rights reserved.</p>
    </footer>

    <script>
        // スムーズスクロール
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
</body>
</html>
