name: Build Kiku (macOS + Windows)

on:
  push:
    branches: [main, claude/plaud-note-pro-desktop-9s0xyg]
    paths: ['desktop-recorder/**', '.github/workflows/build-desktop-recorder.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Native helper that reports which mic Zoom / the browser is using.
      - run: npm run build:native

      - name: Smoke-test the mic helper
        run: |
          ./native/bin/mic-in-use | tee /tmp/mic.json
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/mic.json','utf8')); if(!Array.isArray(s.devices)||!Array.isArray(s.processes)) process.exit(1)"
          lipo -archs native/bin/mic-in-use

      # Package the .app for Apple Silicon and Intel without a Developer ID.
      - run: npx electron-builder --mac dir --arm64 --x64 -c.mac.identity=null --publish never

      # Ad-hoc sign so macOS shows "unverified developer" (openable) instead of "damaged",
      # then wrap each .app in a .dmg with an Applications shortcut.
      - name: Sign ad-hoc and create DMGs
        run: |
          set -euo pipefail
          mkdir -p out
          for pair in "mac-arm64:AppleSilicon" "mac:Intel"; do
            dir="dist/${pair%%:*}"; label="${pair##*:}"
            app="$dir/Kiku.app"
            codesign --force --deep --sign - "$app"
            stage="$(mktemp -d)"
            cp -R "$app" "$stage/"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "Kiku" -srcfolder "$stage" -ov -format UDZO \
              "out/Kiku-mac-$label.dmg"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Kiku-mac
          path: desktop-recorder/out/*.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run check

      # One-click installer (per user, no admin rights needed).
      - run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Kiku-windows
          path: desktop-recorder/dist/Kiku-Windows-Setup.exe

  # Publish both platforms to one fixed release so there is always a single download page.
  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to release "desktop-recorder-latest"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la out
          tag=desktop-recorder-latest
          gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag || true
          cat > notes.md <<'NOTES'
          ## ダウンロード

          | パソコン | ファイル |
          | --- | --- |
          | Mac（M1 / M2 / M3 / M4） | Kiku-mac-AppleSilicon.dmg |
          | Mac（Intel） | Kiku-mac-Intel.dmg |
          | Windows 10 / 11 | Kiku-Windows-Setup.exe |

          Mac のチップは  メニュー →「このMacについて」で確認できます。
          NOTES
          gh release create "$tag" out/* --repo "$REPO" --prerelease --target "$GITHUB_SHA" \
            --title "Kiku（Mac / Windows）" --notes-file notes.md
